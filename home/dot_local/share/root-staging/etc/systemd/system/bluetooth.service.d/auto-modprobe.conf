# Managed by chezmoi: ~/.local/share/root-staging → /etc/systemd/system/
#
# Companion to /etc/modprobe.d/blacklist-btusb.conf: btusb is blacklisted, so
# load it on bluetooth.service start, unload on stop. The upstream unit gates
# start on /sys/class/bluetooth existing — that sysfs node is only created
# once the kernel `bluetooth` module is loaded (pulled in by btusb), so we
# reset the condition list and let ExecStartPre create the node.
#
# `+` runs modprobe outside the unit's sandbox (User/Group/CapabilityBoundingSet
# etc.); the upstream unit strips CAP_SYS_MODULE, so a plain ExecStartPre would
# fail with EPERM. bluetoothd itself keeps the original restricted environment.

[Unit]
ConditionPathIsDirectory=

[Service]
ExecStartPre=+/usr/bin/modprobe btusb
ExecStopPost=+-/usr/bin/modprobe -r btusb
