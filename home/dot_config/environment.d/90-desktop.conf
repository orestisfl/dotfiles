# systemd --user environment. Loaded once at login by pam_systemd; this is
# the source of truth for static user env. Shell startup files (~/.profile,
# ~/.zlogin) re-source these so non-systemd children of the login (ly's
# `sh -l` -> sway, zsh's auto-startx -> i3) see the same values.
#
# Syntax is a POSIX-ish KEY=VALUE; only $VAR / ${VAR:-default} expansion is
# supported, no command substitution. Values quoted for safety when sourced
# by sh.

# --- editors -----------------------------------------------------------------
EDITOR="nvim"
VISUAL="nvim"
SYSTEMD_EDITOR="nvim"

# --- terminal ----------------------------------------------------------------
TERMINAL="ghostty"

# --- gtk ---------------------------------------------------------------------
# Theme is gsettings + xdg-desktop-portal; only the scrollbar style stays.
GTK_OVERLAY_SCROLLING="0"

# --- paths -------------------------------------------------------------------
GOPATH="${HOME}/go"
PATH="${HOME}/.local/bin:${HOME}/bin:${PATH}:${HOME}/go/bin:/usr/bin/core_perl:${HOME}/.local/share/npm-global/bin"

# --- agents ------------------------------------------------------------------
# gcr-ssh-agent.service listens on this socket.
SSH_AUTH_SOCK="${XDG_RUNTIME_DIR}/gcr/ssh"
