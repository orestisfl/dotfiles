[[plugin.prepend_fetchers]]
id    = "git"
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
id    = "git"
url   = "*/"
run   = "git"
group = "git"

# Opener definitions
[opener]
open = [
	{ run = "xdg-open %s1", desc = "Open", orphan = true, for = "linux" },
]

baobab = [
	{ run = 'baobab "$1"', desc = "Baobab", orphan = true, for = "linux" },
]

reveal = [
	{ run = "xdg-open %d1", desc = "Reveal gigi" },
]

# Open rules - add baobab as an option for directories in open --interactive
[open]
prepend_rules = [
	{ url = "*/", use = [ "edit", "open", "baobab" ] },
]
