# networkmanager-dmenu: rofi front-end for NetworkManager.
# Replaces nm-applet; invoked from i3-rofi-actions on both sway and i3.
# The script appends `-dmenu -p <prompt>` for rofi automatically.

[dmenu]
dmenu_command = rofi -i
wifi_icons = 󰤯󰤟󰤢󰤥󰤨
list_saved = True
prompt = Networks

[editor]
terminal = ghostty
gui = nm-connection-editor
gui_if_available = True
